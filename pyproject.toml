[project]
name = "command-hub"
version = "0.1.0"
description = "Command Hub v1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.1",
  "google-genai>=1.0.0",
  "pydantic>=2.9.0",
  "PyNaCl>=1.5.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
